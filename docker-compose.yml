version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  back3:
    build: .
    container_name: back3
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=mongodb://mongo:27017/tuDB
    depends_on:
      - mongo

volumes:
  mongo_data:
